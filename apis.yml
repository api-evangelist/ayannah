aid: ayannah
name: Ayannah
description: >-
  Ayannah (Ayannah Information Systems, Inc.) is a Philippines-based fintech
  company providing digital finance and digital commerce services to the
  emerging middle class across emerging markets, many of whom are migrants
  and/or unbanked. It operates a market-proven stack of digital financial
  services spanning payments, commerce, and analytics, reporting 10K+
  touchpoints and 50M+ transactions processed. Marquee products include Sendah
  Direct (a B2B SaaS payment platform for retailers offering mobile top-ups,
  game credits, and domestic remittance, adopted in 7,000+ outlets), Sendah
  Remit (bank-grade interoperable international and domestic remittance), Sendah
  (a B2C gift-remittance service for Overseas Filipinos), and Asira (Indonesian
  B2B2C/B2C lending, insurance, and investment apps). Ayannah is backed by 500
  Global. This profile is maintained by the API Evangelist network; the company
  publishes a corporate marketing site but no public developer portal, API
  documentation, or machine-readable API specification at this time.
